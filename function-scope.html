<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Function scope example</title>
</head>

<body>

  <script>
    const x = 1;

    function a() {
      const y = 2;
      output(y)
      output(x)
    }

    function b() {
      const z = 3;
      output(z)
    }

    if (x === 1) {
      const c = 4;
      let d = 5;
    }

    for (let i = 0; i <= 1; i++) {
      const e = 6;
      let f = 7;
    }
    function output(value) {
      const para = document.createElement('p');
      document.body.appendChild(para);
      para.textContent = `Value: ${value}`;
    }
  </script>
</body>

</html>
